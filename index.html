<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Save the Rabbit!</title>
<!--
  FOR POKI: uncomment the line below before uploading the game to Poki for Developers.
  Without it the game runs standalone — ad calls are simply skipped.
-->
<!-- <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script> -->
<style>
/*
  VOICE: a cozy winter fairy tale, kind and kid-friendly
  IDEA: a snowy night forest as a puppet-theatre stage
  PICTURE: the whole game is a code-drawn scene (firs, moon, snow, characters)
  COLOUR and TYPE: deep blue + snow white + red accent (hat, hearts); bold rounded font
  LAYOUT: full-screen canvas, HUD on top, menu cards centred
*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;min-height:480px;overflow:hidden;background:#16244a;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,"PingFang SC","Hiragino Sans","Microsoft YaHei","Noto Sans CJK SC","Malgun Gothic","Apple SD Gothic Neo","Nirmala UI","Noto Sans Devanagari",sans-serif}
#game{display:block;position:fixed;inset:0}
.item canvas{display:block}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(12,22,48,.45);padding:16px;z-index:5}
.card{background:linear-gradient(#ffffff,#e4eefa);border-radius:26px;padding:26px 28px 22px;text-align:center;
  box-shadow:0 14px 44px rgba(0,0,0,.4),inset 0 -4px 0 #c9d9ee;width:min(430px,100%);color:#1e3a5f}
h1{margin:0 0 8px;font-size:clamp(34px,9vw,50px);line-height:1.05;color:#2563a8;text-shadow:0 3px 0 #bcd6f2}
h2{margin:0 0 14px;font-size:32px;line-height:1.1;color:#2563a8}
.sub{margin:0 0 16px;font-size:16px;line-height:1.45;color:#35557d}
.how{display:grid;gap:6px;margin:0 0 18px;font-size:15px;color:#35557d;text-align:left;
  background:#eef4fc;border-radius:14px;padding:12px 14px}
.how b{color:#1e3a5f}
.btn{font:inherit;font-weight:800;font-size:22px;border:0;border-radius:16px;padding:14px 30px;margin:6px;
  cursor:pointer;color:#fff;background:linear-gradient(#ff8a3d,#f0602a);box-shadow:0 5px 0 #b8431a;min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8431a}
.btn:focus-visible{outline:3px solid #2563a8;outline-offset:3px}
.btn.green{background:linear-gradient(#4cc97a,#2aa35a);box-shadow:0 5px 0 #1d7540;font-size:18px}
.btn.green:active{box-shadow:0 2px 0 #1d7540}
.btn.ad{background:linear-gradient(#5aa9ff,#2f7fd1);box-shadow:0 5px 0 #1f5fa3;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ad:active{box-shadow:0 2px 0 #1f5fa3}
.btn.same{width:min(300px,100%);margin-left:auto;margin-right:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.adico{width:26px;height:26px;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.langbtn .adico rect{fill:#2f7fd1}.langbtn .adico path{fill:#ffffff}
.card{max-height:calc(100% - 8px);overflow-y:auto;touch-action:pan-y}
.btn:disabled{opacity:.6}
.best{margin-top:10px;font-size:15px;color:#5a7699}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.stats div{background:#eef4fc;border-radius:14px;padding:10px 4px}
.stats span{display:block;font-size:13px;color:#5a7699}
.stats b{display:block;font-size:26px;color:#1e3a5f}
.newrec{font-weight:800;color:#e23b4e;font-size:20px;margin:0 0 10px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;z-index:6;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.pill{background:rgba(255,255,255,.88);border-radius:999px;padding:6px 14px;font-weight:800;color:#1e3a5f;font-size:18px;
  box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.pill small{font-size:12px;color:#5a7699;font-weight:700}
#hudLives span{color:#e23b4e;letter-spacing:1px}
#hudLives span.lost{opacity:.22}
.overlay.soft{background:rgba(12,22,48,.25)}
.spacer{flex:1}
.langbtn{font:inherit;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 16px;min-height:44px;
  border-radius:999px;border:2px solid #c9d9ee;background:#fff;color:#1e3a5f;cursor:pointer}
.langbtn svg{width:20px;height:20px;flex:none}
.langgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.langgrid button{font:inherit;font-weight:700;font-size:17px;min-height:48px;border-radius:14px;border:2px solid #c9d9ee;background:#fff;color:#1e3a5f;cursor:pointer}
.langgrid button.on{background:#2563a8;color:#fff;border-color:#2563a8}
#langPick{z-index:7}
#shop{z-index:7}
.carrot{width:20px;height:20px;flex:none}
.shopbtn{margin-top:4px}
.shopcard{max-height:92vh;max-height:92dvh;overflow-y:auto;touch-action:pan-y;padding:20px 18px}
.shopcard h3{margin:14px 0 8px;font-size:18px;color:#35557d;text-align:left}
.balance{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:22px;color:#d9631e}
.balance .carrot{width:26px;height:26px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.item{font:inherit;font-weight:800;font-size:14px;color:#1e3a5f;background:#eef4fc;border:2px solid transparent;border-radius:14px;
  padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:44px}
.item canvas{width:64px;height:64px}
.item.on{border-color:#2563a8;background:#dfeafb}
.item.locked{opacity:.5}
.item .price{display:flex;align-items:center;gap:3px}
.item .price .carrot{width:16px;height:16px}
.carrotline{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:20px;color:#d9631e;margin:0 0 6px}
.minor{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.shopwrap{position:relative;display:inline-block}
.tapHand{position:absolute;right:-30px;bottom:-30px;width:42px;height:50px;pointer-events:none;display:none;animation:tap .9s ease-in-out infinite}
.hinting .tapHand{display:block}
.hinting{margin-bottom:30px;margin-right:24px}
.hinting .langbtn{border-color:#ffb020;animation:glow 1.2s ease-in-out infinite}
@keyframes tap{50%{transform:translate(-7px,-9px)}}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,176,32,.4)}}
.shophint{margin:8px 0 8px;font-weight:800;font-size:16px;color:#d9631e;line-height:1.35}
@media (prefers-reduced-motion:reduce){.tapHand,.hinting .langbtn{animation:none}}
#btnDouble{justify-content:center;text-align:center}
.rows{display:grid;gap:6px;margin:0 0 16px}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#eef4fc;border-radius:12px;padding:9px 16px;font-size:17px;color:#35557d}
.rows b{color:#1e3a5f;font-size:19px}
.rows .hearts{color:#e23b4e;letter-spacing:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
#hudSavedPill,#hudCarrotPill{display:flex;align-items:center;gap:4px}
.ico{width:22px;height:22px;flex:none}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
#hud>.ibtn{align-self:flex-start;flex:none}
#hud.menu-mode .pill,#hud.menu-mode #btnPause{display:none}
.ibtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.88);
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:0}
.ibtn svg{width:24px;height:24px}
@media(max-height:520px){
  body.modal #hud{display:none}
  .overlay{padding:6px}.card{padding:12px 18px 10px}
  h1{font-size:30px;margin-bottom:4px}h2{font-size:22px;margin-bottom:6px}
  .btn{font-size:17px;padding:8px 18px;min-height:42px;margin:4px auto}
  .btn.same{width:min(260px,100%)}
  .rows{grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}.rows div{padding:5px 12px;font-size:15px}.rows b{font-size:16px}
  .stats{margin-bottom:6px}.stats div{padding:4px}.stats b{font-size:20px}
  .newrec{font-size:16px;margin-bottom:4px}.carrotline{font-size:17px;margin-bottom:2px}
  .langbtn{margin-top:4px;min-height:40px;padding:6px 14px}.shophint{margin:4px 0}
  .items{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
@media(max-width:420px){.pill{font-size:15px;padding:5px 10px}.pill small{display:none}#hud{gap:6px}.pills{gap:6px}.ico{width:19px;height:19px}}
</style>
</head>

</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 data-i18n="title">Save the Rabbit!</h1>
    <button class="btn" id="btnPlay" data-i18n="play">Play</button>
    <div><button class="langbtn shopbtn" data-open-shop><svg class="carrot" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5 10 9.6q2.6-2.2 4.6-.3 1.9 2-.3 4.6z" fill="#ff8a2a"/><path d="M7 15.5l2 1M9.5 12.2l2 1" stroke="#d9631e" stroke-width="1.2" stroke-linecap="round"/><path d="M13.8 9.6Q14.6 4 19 2.8q-1.4 4.3-5.2 6.8zM14.4 10.2q4.9-2.3 7.3.4-4.3 1.7-7.3-.4z" fill="#2fa35a"/></svg><span data-i18n="shop">Shop</span> · <b class="carrotCount">0</b></button></div>

</div>

    <button class="langbtn" data-open-lang><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#2563a8" stroke-width="2"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" fill="none" stroke="#2563a8" stroke-width="2"/></svg><span class="langname"></span></button></div>

    </div>
  </div>
</div>

<script>
{
'use strict';

/* ================= Poki SDK (safe wrapper) ================= */
// The Poki build includes the SDK tag. Without it (local testing) rewards are granted immediately.
const DEV = !document.querySelector('script[src*="poki-sdk"]');
let hadInput = false; // Poki: gameplayStart only after the player's first input, not on load
const Poki = (() => {
  const sdk = () => window.PokiSDK;
  let ready = false, playing = false;
  return {
    get on() { return ready && !!sdk(); },
    init() {
      if (!sdk()) return Promise.resolve();
      return sdk().init().then(() => { ready = true; }).catch(() => { ready = true; }); // ad blocker: the game still works
    },
    loadingFinished() { if (this.on) sdk().gameLoadingFinished(); },
    start() { if (playing || !hadInput) return; playing = true; if (this.on) sdk().gameplayStart(); },
    get canReward() { return this.on || DEV; },
    stop() { if (!playing) return; playing = false; if (this.on) sdk().gameplayStop(); },
    commercialBreak() {
      this.stop();
      if (!this.on) return Promise.resolve();
      return sdk().commercialBreak(() => Sound.adMute(true))
        .then(() => Sound.adMute(false)).catch(() => Sound.adMute(false));
    },
    rewardedBreak() {
      this.stop();

const store = {

  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ================= Sound and music (WebAudio, no files) ================= */
const Sound = (() => {
  let ac = null, master = null, sfx = null, musicIn = null, musicGain = null, noiseBuf = null;
  let muted = store.get('str_muted', '0') === '1', musicOn = store.get('str_music', '1') === '1', adMuted = false;
  let level = 1;
  const musicVol = () => musicOn ? 0.35 * level : 0;
  const apply = () => {
    if (!ac) return;
    master.gain.setTargetAtTime(adMuted ? 0 : 0.6, ac.currentTime, 0.05);
    sfx.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.05);
    musicGain.gain.setTargetAtTime(musicVol(), ac.currentTime, 0.25);
  };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // --- Music: winter "music box" melody, A minor, 8 bars ---
  const MELODY = [
    76,0,72,0,69,72,76,0,  77,0,76,0,72,0,69,0,  72,0,74,76,79,0,76,0,  74,0,71,0,67,0,0,0,
    76,0,72,0,69,72,76,81, 79,0,77,0,76,0,72,0,  74,0,77,0,76,74,72,0,  71,0,68,0,64,0,0,0
  ];
  const BASS = [45, 41, 48, 43, 45, 41, 50, 40];
  const CHORDS = [[57,60,64],[53,57,60],[55,60,64],[55,59,62],[57,60,64],[53,57,60],[57,62,65],[56,59,64]];
  let playing = false, step = 0, nextT = 0, timer = null, tempo = 96, intensity = 0;

  function voice(freq, t, dur, type, vol, attack, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function jingle(t, vol) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    s.connect(f); f.connect(g); g.connect(musicIn); s.start(t); s.stop(t + 0.15);
  }
  function scheduleStep(i, t, len) {
    const bar = Math.floor(i / 8), beat = i % 8, chord = CHORDS[bar];
    const m = MELODY[i];
    if (m) { voice(mtof(m), t, 1.0, 'sine', 0.13, 0.004, musicIn); voice(mtof(m) * 2, t, 0.35, 'triangle', 0.03, 0.004, musicIn); }
    if (beat === 0) for (const n of chord) voice(mtof(n), t, len * 8.2, 'sine', 0.035, 0.4, musicIn);
    if (beat === 0 || beat === 4) voice(mtof(BASS[bar]), t, len * 3.5, 'triangle', 0.11, 0.01, musicIn);
    if (intensity >= 1 && beat % 2 === 1) voice(mtof(chord[(beat >> 1) % 3] + 12), t, 0.3, 'triangle', 0.025, 0.004, musicIn);
    if (intensity >= 2 && (beat === 2 || beat === 6)) jingle(t, 0.05);
    if (intensity >= 2 && beat % 2 === 1) jingle(t, 0.02);
  }
  function tick() {
    if (!playing || !ac) return;
    while (nextT < ac.currentTime + 0.25) {
      const len = 60 / tempo / 2;
      if (musicOn && !adMuted) scheduleStep(step, nextT, len);
      nextT += len; step = (step + 1) % MELODY.length;
    }
  }
  function startMusic() {
    if (!ac || playing) return;
    playing = true; step = 0; nextT = ac.currentTime + 0.15;
    timer = setInterval(tick, 50); tick();
  }

  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ac = new AC();
        master = ac.createGain(); master.gain.value = adMuted ? 0 : 0.6; master.connect(ac.destination);
        sfx = ac.createGain(); sfx.gain.value = muted ? 0 : 1; sfx.connect(master);
        musicGain = ac.createGain(); musicGain.gain.value = musicVol(); musicGain.connect(master);
        musicIn = ac.createGain(); musicIn.connect(musicGain);
        const delay = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter();
        delay.delayTime.value = 0.42; fb.gain.value = 0.28; lp.type = 'lowpass'; lp.frequency.value = 2500;
        musicIn.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(musicGain);
        noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; return; }
    }
    if (ac.state === 'suspended' && !document.hidden) ac.resume().catch(() => {});
    startMusic();
  }
  function tone(f1, f2, dur, type, vol, delay) {
    if (!ac || muted || adMuted) return;
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + dur + 0.03);
  }
  return {
    ensure,
    get muted() { return muted; },
    get musicOn() { return musicOn; },
    // "sounds" button — effects only (throws, hits)
    toggle() { muted = !muted; store.set('str_muted', muted ? '1' : '0'); apply(); return muted; },
    // "music" button — background melody only
    toggleMusic() { musicOn = !musicOn; store.set('str_music', musicOn ? '1' : '0'); apply(); return musicOn; },
    adMute(v) { adMuted = v; apply(); },
    // music volume: 1 — gameplay, lower — pause / game over
    duck(v) { level = v; apply(); },
    // music gets faster and richer with every wave
    setWave(n) { tempo = 96 + Math.min(n - 1, 6) * 3; intensity = n >= 5 ? 2 : n >= 3 ? 1 : 0; },
    suspend(hidden) { if (!ac) return; if (hidden) ac.suspend().catch(() => {}); else if (!adMuted) ac.resume().catch(() => {}); },
    throw() { tone(1500, 600, 0.11, 'triangle', 0.07); },
    hit() { tone(330, 110, 0.16, 'square', 0.06); tone(1000, 2000, 0.09, 'sine', 0.07, 0.02); },
    flee() { tone(520, 180, 0.35, 'sawtooth', 0.045); },
    save() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0, 0.13, 'sine', 0.12, i * 0.07)); },
    caught() { tone(420, 140, 0.55, 'triangle', 0.16); },
    power() { [520, 780, 1040].forEach((f, i) => tone(f, f * 1.5, 0.15, 'sine', 0.1, i * 0.06)); },
    over() { [440, 370, 311, 262].forEach((f, i) => tone(f, 0, 0.26, 'triangle', 0.14, i * 0.18)); }
  };
})();

  Poki.rewardedBreak().then(ok => {
    game.state = 'over'; b.disabled = false;
    if (ok) { game.doubled = true; game.bonusCarrots = game.carrotsRun; addCarrots(game.bonusCarrots); updateCarrots(true); $('ovCarrots').textContent = game.carrotsRun + game.bonusCarrots; Sound.power(); }
    b.classList.add('hidden');
  });
});
updateCarrots(true);

/* ================= Controls ================= */
function setPointer(e) { pointer.x = e.clientX; pointer.y = e.clientY; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); Sound.ensure(); setPointer(e);
  if (game.state !== 'play' || game.ending) return;
  pointer.down = true; aimUpdate(); if (game.cool <= 0) fire();
});
window.addEventListener('pointermove', setPointer);
window.addEventListener('pointerup', () => { pointer.down = false; });
window.addEventListener('pointercancel', () => { pointer.down = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  markInput();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (game.state === 'play') pauseGame(); else if (game.state === 'pause') resumeGame(); }
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyN') toggleMusic();
  if (e.code === 'Space' || e.code === 'Enter') {
    Sound.ensure();
    if (game.state === 'menu' && shopEl.classList.contains('hidden') && langEl.classList.contains('hidden')) $('btnPlay').click();
    else if (game.state === 'break') $('btnNext').click();
    else if (game.state === 'play' && !game.ending && game.cool <= 0) { aimUpdate(); fire(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); Sound.suspend(document.hidden); });
// music starts on the first tap (browsers block audio before user input)
function markInput() { if (hadInput) return; hadInput = true; if (game.state === 'play' && !game.ending) Poki.start(); }
document.addEventListener('pointerdown', () => { Sound.ensure(); markInput(); }, true);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(document.documentElement);

$('btnPlay').addEventListener('click', () => { Sound.ensure(); hide(menuEl); game.state = 'ad'; Poki.commercialBreak().then(startGame); });
$('btnResume').addEventListener('click', resumeGame);
$('btnPause').addEventListener('click', pauseGame);
$('btnMute').addEventListener('click', toggleMute);
$('btnMusic').addEventListener('click', toggleMusic);
$('btnNext').addEventListener('click', () => {
  if (game.state !== 'break') return;
  Sound.ensure(); hide(betweenEl); game.state = 'ad';
  // regular ads only after even waves (2, 4, 6...)
  if (game.wave % 2 === 0) Poki.commercialBreak().then(proceedWave); else proceedWave();
});
$('btnLife').addEventListener('click', () => {
  if (game.state !== 'break') return;
  const b = $('btnLife'); b.disabled = true; hide(betweenEl); game.state = 'ad';
  Poki.rewardedBreak().then(ok => {
    if (ok) {
      game.lives = Math.min(game.lives + 1, 5); updateHud(); Sound.power();
      proceedWave(); // no regular ad right after a rewarded one
      popup(playerX, playerY - 135 * S, '+♥', '#ff4d6d', 34 * S);
    } else { game.state = 'break'; b.classList.add('hidden'); show(betweenEl); }
  });
});
$('btnRestart').addEventListener('click', () => {
  Sound.ensure(); hide(overEl); game.state = 'ad';
  Poki.commercialBreak().then(startGame);
});
$('btnContinue').addEventListener('click', () => {
  const btn = $('btnContinue'); btn.disabled = true; game.state = 'ad';
  Poki.rewardedBreak().then(ok => {
    btn.disabled = false;
    if (ok) {
      game.continues++; game.lives = 1; game.ending = false; hide(overEl);
      for (const w of wolves) if (w.state === 'chase') wolfDefeated(w);
      game.banner = { text: T('retry'), sub: T('wolvesFled'), t: 0, life: 1.8 };
      game.state = 'play'; updateHud(); Poki.start(); Sound.duck(1);
    } else { game.state = 'over'; btn.classList.add('hidden'); }
  });
});

/* ---- Language picker ---- */
const langEl = $('langPick');
function openLang() {
  $('langGrid').innerHTML = LANGS.map(([c, n]) => `<button data-lang="${c}" class="${c === lang ? 'on' : ''}" lang="${c}">${n}</button>`).join('');
  show(langEl);
}
document.querySelectorAll('[data-open-lang]').forEach(b => b.addEventListener('click', openLang));
langEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (b) { store.set('str_lang', b.dataset.lang); applyLang(b.dataset.lang); updateHud(); hide(langEl); }
  else if (e.target === langEl) hide(langEl);
});
// language: player's choice → browser language → English (Poki's language is applied after init)
applyLang(pickLang(store.get('str_lang', '')) || (navigator.languages || [navigator.language]).map(pickLang).find(Boolean) || 'en');

/* ================= Start ================= */
if (firstTime) hide(menuEl); else syncModal(); // first launch — straight into the game, no menu
resize();
updateMuteIcon();
$('menuBest').textContent = game.best;
let last = performance.now(), loopErr = false;
function loop(now) {
  requestAnimationFrame(loop); // request the next frame first — a single error won't stop the game
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (!bg) { resize(); if (!bg) return; }
  try {
    updateSnow(dt);
    if (game.state === 'play') update(dt); else game.time += dt;
    render();
  } catch (e) { if (!loopErr) { loopErr = true; console.error(e); } }
}
requestAnimationFrame(loop);
Poki.init().then(() => {
  if (!store.get('str_lang', '')) {
    try { const c = pickLang(window.PokiSDK && PokiSDK.getLanguage && PokiSDK.getLanguage()); if (c) { applyLang(c); updateHud(); } } catch (e) {}
  }
  Poki.loadingFinished();
  if (firstTime && game.state === 'menu') startGame();
});
}
</script>
</body>
